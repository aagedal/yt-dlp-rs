[package]
name = "yt-dlp-rs"
version = "0.8.0-beta.1"
edition = "2024"
license = "Unlicense"
description = "An incremental, native Rust adaptation of yt-dlp"

[dependencies]
aes = "0.9"
base64 = "0.22"
bytes = "1"
cbc = "0.2"
clap = { version = "4.6", features = ["derive"] }
cookie = "0.18"
cookie_store = { version = "0.22", default-features = false }
encoding_rs = "0.8"
flate2 = "1"
http = "1"
http-body = "1"
httpdate = "1"
hyper = { version = "1", default-features = false }
log = { version = "0.4", features = ["std"] }
icu_normalizer = "2.3"
icu_properties = "2.3"
percent-encoding = "2.3"
# Without `perf-onepass`: a one-pass DFA is built for every pattern with a
# capture group but only serves anchored searches (URL matches, where the
# backtracker is as fast), and dispatch compiles nearly every extractor's
# `_VALID_URL`, so it was most of the peak memory (docs/BENCHMARKS.md).
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf-backtrack", "perf-cache", "perf-dfa", "perf-inline", "perf-literal"] }
ring = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "cookies", "socks"] }
roxmltree = "0.21"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
scraper = { version = "0.24", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
thiserror = "2"
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
url = { version = "2", features = ["serde"] }
webpki-roots = "1"
# `--features impersonate`: browser TLS/HTTP2 impersonation (BoringSSL;
# needs cmake and a C/C++ toolchain to build).
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "time", "net"], optional = true }
wreq = { version = "=6.0.0-rc.31", default-features = false, features = ["webpki-roots", "tokio-rt", "cookies", "socks", "gzip", "brotli", "deflate", "zstd"], optional = true }
wreq-util = { version = "=3.0.0-rc.14", features = ["emulation-compression"], optional = true }
pkcs8 = { version = "0.10", features = ["encryption", "pem", "std"] }

[profile.release]
# Whole-program optimization and a stripped binary. Keep `panic = "unwind"`:
# extractor panics are caught per URL, and thread joins report worker panics.
lto = "thin"
codegen-units = 1
strip = true

[features]
default = []
impersonate = ["dep:tokio", "dep:wreq", "dep:wreq-util"]


[lints.rust]
# `cargo fuzz` builds with `--cfg fuzzing` (see src/fuzz.rs).
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[dev-dependencies]
# `tests/url_literals.rs` derives each URL pattern's prefilter literals.
regex-syntax = "0.8"
