[package]
name = "yt-dlp-rs"
version = "0.1.0"
edition = "2024"
license = "Unlicense"
description = "An incremental, native Rust adaptation of yt-dlp"

[dependencies]
aes = "0.9"
cbc = "0.2"
clap = { version = "4.6", features = ["derive"] }
cookie = "0.18"
cookie_store = { version = "0.22", default-features = false }
httpdate = "1"
percent-encoding = "2.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "cookies"] }
roxmltree = "0.21"
scraper = { version = "0.24", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
url = { version = "2", features = ["serde"] }

