# The CLI parser needs more stack than test threads get by default; the binary
# itself runs on a thread with a large stack (see `main`).
[env]
RUST_MIN_STACK = "67108864"

# Windows binaries link the C runtime statically, so they start without the
# Visual C++ Redistributable (BoringSSL's CMake build follows the feature).
[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "target-feature=+crt-static"]
