[package]
name = "yt-dlp-rs-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
yt-dlp-rs = { path = ".." }

# Keep the fuzz crate out of the main workspace.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "hls"
path = "fuzz_targets/hls.rs"
test = false
doc = false
bench = false

