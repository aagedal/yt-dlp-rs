name: Release
# A `v*` tag builds release binaries and publishes a GitHub release; tags
# with a pre-release suffix (`v0.3.0-beta.1`) publish a pre-release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Linux and macOS binaries include browser impersonation (wreq on
        # BoringSSL), which sites such as Dailymotion's CDN require.
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            features: --features impersonate
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            features: --features impersonate
          - target: aarch64-apple-darwin
            os: macos-latest
            features: --features impersonate
          - target: x86_64-apple-darwin
            os: macos-latest  # cross-builds x86_64 (macos-13 runners are retired)
            features: --features impersonate
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            features: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }} ${{ matrix.features }}
      - name: Package
        shell: bash
        run: |
          name="yt-dlp-rs-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE "$name/"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/yt-dlp-rs.exe" "$name/"
            7z a "$name.zip" "$name" >/dev/null
            echo "ASSET=$name.zip" >> "$GITHUB_ENV"
          else
            cp "target/${{ matrix.target }}/release/yt-dlp-rs" "$name/"
            tar -czf "$name.tar.gz" "$name"
            echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
