name: CI
on: [push, pull_request]

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Site fixtures were captured with FFmpeg available (format selection).
      - name: Install FFmpeg
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS) brew install ffmpeg ;;
            Windows) choco install ffmpeg -y --no-progress ;;
            Linux) command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg) ;;
          esac
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --no-fail-fast
      # docs/SITES.md and COMPATIBILITY.md's summary against the registry.
      - if: runner.os == 'Linux'
        run: python3 tools/extractor_tiers.py --check
  impersonate:
    # The `impersonate` feature (wreq on BoringSSL: CMake, a C/C++ toolchain
    # and libclang for bindgen, all on the runners) that every release ships.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: impersonate
      - run: cargo clippy --locked --all-targets --features impersonate -- -D warnings
      - run: cargo test --locked --features impersonate --test impersonate
      - run: cargo test --locked --features impersonate --lib impersonate
      # The static C runtime (.cargo/config.toml), BoringSSL's included.
      - if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --locked --features impersonate
          ! grep -aqi -e vcruntime140 -e msvcp140 target/debug/yt-dlp-rs.exe
  fuzz:
    # Short libFuzzer runs of every parser target (fuzz/), seeded from the
    # test fixtures. Longer runs: `cargo +nightly fuzz run TARGET` locally.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
          key: fuzz
      - run: cargo install cargo-fuzz --locked
      - run: fuzz/seed.sh
      - name: Run each target for 30 seconds
        working-directory: fuzz
        run: |
          for target in $(cargo fuzz list); do
            cargo fuzz run -O "$target" -- -max_total_time=30 -timeout=10 -rss_limit_mb=4096 -max_len=262144
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
  semver:
    # The library API against the latest release tag; breaking changes fail
    # from 1.0 on (tools/semver_check.py, docs/LIBRARY.md "Stability").
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: semver
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      - run: python3 tools/semver_check.py
  advisories:
    # RustSec advisories for every feature's dependencies and the fuzz crate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny --all-features check advisories
      - run: cargo deny check advisories
        working-directory: fuzz
  notices:
    # The release's THIRD-PARTY-NOTICES.txt: fails on a dependency whose
    # license tools/notices/about.toml does not accept.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - run: tools/notices/generate.sh "$RUNNER_TEMP/THIRD-PARTY-NOTICES.txt"
  upstream-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools -p 'test_*.py' -v
  youtube-challenges:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Site fixtures were captured with FFmpeg available (format selection).
      - name: Install FFmpeg
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS) brew install ffmpeg ;;
            Windows) choco install ffmpeg -y --no-progress ;;
            Linux) command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg) ;;
          esac
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7
      - name: Require the pinned runtime for offline challenge tests
        shell: bash
        run: deno eval 'console.log("YT_DLP_RS_TEST_DENO=" + Deno.execPath())' >> "$GITHUB_ENV"
      - run: cargo test --locked --lib extractor::youtube
      # Site fixtures whose YouTube cases solve challenges need deno on PATH.
      - run: cargo test --locked --test sites

  direct-adaptive-merge:
    # Pinned: ubuntu-latest (26.04) installs FFmpeg 8.0.1, whose Opus stream
    # copy of the merge fixtures trips ffprobe ("Error parsing Opus packet
    # header"); FFmpeg 6.1 (24.04) and 9.0 are clean.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install real local merge tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Verify copied audio and video tracks from local fixtures
        env:
          YT_DLP_RS_TEST_FFMPEG: /usr/bin/ffmpeg
          YT_DLP_RS_TEST_FFPROBE: /usr/bin/ffprobe
        run: cargo test --locked --test merge --test hls_media --test dash_media --test audio --test video --test subtitle_conversion --test subtitle_embedding
      - name: Verify local audio target encoders and bounded processing
        env:
          YT_DLP_RS_TEST_FFMPEG: /usr/bin/ffmpeg
          YT_DLP_RS_TEST_FFPROBE: /usr/bin/ffprobe
        run: cargo test --locked --lib audio::ffmpeg
      - name: Verify local video remux and conversion process
        env:
          YT_DLP_RS_TEST_FFMPEG: /usr/bin/ffmpeg
          YT_DLP_RS_TEST_FFPROBE: /usr/bin/ffprobe
        run: cargo test --locked --lib video::ffmpeg
      - name: Verify local subtitle conversion formats and native TTML
        env:
          YT_DLP_RS_TEST_FFMPEG: /usr/bin/ffmpeg
          YT_DLP_RS_TEST_FFPROBE: /usr/bin/ffprobe
        run: cargo test --locked --lib subtitle_convert
      - name: Verify local subtitle embedding containers and metadata
        env:
          YT_DLP_RS_TEST_FFMPEG: /usr/bin/ffmpeg
          YT_DLP_RS_TEST_FFPROBE: /usr/bin/ffprobe
        run: cargo test --locked --lib embed_subtitles
