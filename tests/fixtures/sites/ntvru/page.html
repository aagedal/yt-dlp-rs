    <title>Новые русские сенсации &#x2F; Самые громкие русские сенсации &#x2F; «Калоев. Седьмое доказательство бога» &#x2F; Передачи НТВ</title>
<meta name="title" content="Новые русские сенсации / Самые громкие русские сенсации / «Калоев. Седьмое доказательство бога» / Передачи НТВ">
<meta name="description" content="Ошибка диспетчера отобрала у него все — долгожданных детей и любимую жену, а его самого отшвырнуло на обочину жизни. 1 июля 2002 года грузовой Boeing врезался в фюзеляж российского лайнера, 71 человек погиб. Кто-то должен был ответить за смерть этих людей. Полтора года Виталий Калоев ждал справедливости, но не дождавшись, решил поквитаться сам. В выпуске «Новых русских сенсаций» — история Виталия Калоева, который после чудовищной трагедии в жизни стал замечать необъяснимые события, доказывающие существование бога. Какие знаки судьбы он и его близкие получали перед авиакатастрофой и какие роковые совпадения преследовали его семью вплоть до самого вылета. Как Калоев нашел, приговорил и казнил виновника трагедии? Что стало происходить в его жизни после выхода из тюрьмы? А также — первое интервью загадочной женщины, которая повлияла на Виталия Калоева. Кто она? Почему все эти годы она скрывалась от журналистов и отказывалась от интервью? И как мститель Виталий Калоев доказал существование бога? // Смотрите на сайте НТВ">
