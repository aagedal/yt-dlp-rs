    function event(eventAction, eventValue, ga4) {
        var gao = {
            hitType: 'event',

            eventAction: eventAction,
            eventValue: eventValue
        }

        if (ga4) {

           })
       }

        //ga('BBTV.send', gao)
        console.log('Reproductor Live BioBioTV event sended: ', gao)
        return gao
    }

    function elapsedEventAction(elapsed) {
        var pad = '000000'
        return 'elapsed-' + pad.substring(0, pad.length - elapsed.toString().length) + elapsed 
    }

    if (streamType === 'live') {

        var elapsed = 0
        var playEventSended = false
        var volumeEventSended = false

        event('impression')

        player.on('volumechange', function() {
            console.log('Reproductor Live BioBioTV EVENT VOLUME CHANGE', player.volume())
            if (!volumeEventSended && player.volume()) {
                event('volume-up', player.volume())
                volumeEventSended = true
            }
        })

        if (!player.paused()) {
            event('play', undefined, true)
            playEventSended = true
        }

        player.on('play', function () {
            console.log('Reproductor Live BioBioTV EVENT PLAY')
            if(!playEventSended) {
                event('play', undefined, true)
                playEventSended = true
            }            
        })

        setInterval(function () {
            if (!player.paused()) {
                ++elapsed

                // 10 seconds
                if (elapsed % 10 === 0) {
                    event('ping', 10)
                }

                // every minute AND less than 12 hours
                if (elapsed % 60 === 0 && elapsed < 43200) {
                    event(elapsedEventAction(Math.floor(elapsed / 60)))
                }
            }
        }, 1000)

    }
})();

    const $rudoWrapperMessage = document.querySelector('.rudo-wrapper-message');

    let previousSubState = localStorage.getItem('rudo_subs_pref') === 'on';
    let isUserClickingMenu = false;
    player.el().addEventListener('click', function (e) {
      if (e.target.closest('.vjs-menu-item') || e.target.closest('.vjs-menu-settings') || e.target.closest('.vjs-control')) {
        isUserClickingMenu = true;
        setTimeout(() => isUserClickingMenu = false, 1500);
      }
    }, true);

    player.on('texttrackchange', function () {
      if (!player.hasStarted()) return;
      if (!isUserClickingMenu) return; // GUARDIAN INTOCABLE

      const tracks = player.textTracks();
      let active = false;
      for (let i = 0; i < tracks.length; i++) {
        if (tracks[i].mode === 'showing') {
          active = true;
          break;
        }
      }

      if (active) {
        localStorage.setItem('rudo_subs_pref', 'on');
        // Mostrar cartel cada vez que los prende manualmente y antes estaban apagados
        if (!previousSubState) {
          if ($rudoWrapperMessage) {
            $rudoWrapperMessage.classList.remove('is-showed');
            void $rudoWrapperMessage.offsetWidth; // Truco para resetear la animación CSS
            $rudoWrapperMessage.classList.add('is-showed');
          }
        }
        previousSubState = true;
      } else {
        localStorage.setItem('rudo_subs_pref', 'off');
        previousSubState = false;
      }
    });

    player.on('loadedmetadata', function () {
      // text
      const textColor = document.querySelector('#vjs_select_589');
      const textOpacity = document.querySelector('#vjs_select_594');
      // textBackground
      const textBackgroundColor = document.querySelector('#vjs_select_604');
      const textBackgroundOpacity = document.querySelector('#vjs_select_609');
      // captionAreaBackground
      const captionAreaBackgroundColor = document.querySelector('#vjs_select_619');
      const captionAreaBackgroundOpacity = document.querySelector('#vjs_select_624');
      // fontSize
      const fontSize = document.querySelector('#vjs_select_639');
      // textEdgeStyle
      const textEdgeStyle = document.querySelector('#vjs_select_658');
      // fontFamily
      const fontFamily = document.querySelector('#vjs_select_673');

      function getTextTrackSettings() {
        return {
          textColor: { el: textColor ? textColor.id : null, selection: textColor ? textColor.selectedIndex : null },
          textOpacity: { el: textOpacity ? textOpacity.id : null, selection: textOpacity ? textOpacity.selectedIndex : null },
          textBackgroundColor: { el: textBackgroundColor ? textBackgroundColor.id : null, selection: textBackgroundColor ? textBackgroundColor.selectedIndex : null },
          textBackgroundOpacity: { el: textBackgroundOpacity ? textBackgroundOpacity.id : null, selection: textBackgroundOpacity ? textBackgroundOpacity.selectedIndex : null },
          captionAreaBackgroundColor: { el: captionAreaBackgroundColor ? captionAreaBackgroundColor.id : null, selection: captionAreaBackgroundColor ? captionAreaBackgroundColor.selectedIndex : null },
          captionAreaBackgroundOpacity: { el: captionAreaBackgroundOpacity ? captionAreaBackgroundOpacity.id : null, selection: captionAreaBackgroundOpacity ? captionAreaBackgroundOpacity.selectedIndex : null },
          fontSize: { el: fontSize ? fontSize.id : null, selection: fontSize ? fontSize.selectedIndex : null },
          textEdgeStyle: { el: textEdgeStyle ? textEdgeStyle.id : null, selection: textEdgeStyle ? textEdgeStyle.selectedIndex : null },
          fontFamily: { el: fontFamily ? fontFamily.id : null, selection: fontFamily ? fontFamily.selectedIndex : null }
        };
      }

      function updateTextTrackSettings() {
        const trackSettings = getTextTrackSettings();
        localStorage.setItem('trackSettings', JSON.stringify(trackSettings));
      }

      function setTextTrackSettings() {
        const storedSettings = JSON.parse(localStorage.getItem('trackSettings'));

        Object.keys(storedSettings).forEach(key => {
          const setting = storedSettings[key];

          document.querySelector(`#${setting.el}`).selectedIndex = setting.selection;
          document.querySelector(`#${setting.el}`).dispatchEvent(new Event('change'));
        });
      }

      if (!localStorage.getItem('trackSettings')) {
        updateTextTrackSettings();
      } else {
        setTextTrackSettings();
      }

      // Listeners
      document.querySelectorAll('.vjs-text-track-settings select').forEach(select => {
        select.addEventListener('change', updateTextTrackSettings);
      });

      document.querySelector('.vjs-done-button').addEventListener('click', updateTextTrackSettings);
    });

  </script>
