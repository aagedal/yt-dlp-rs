      function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('mainContentOverlay');
        const body = document.body;

        sidebar.classList.toggle('open');
        if (sidebar.classList.contains('open')) {
          body.classList.add('sidebar-open');
          overlay.style.display = 'block';
          updateSidebarHeight();
        } else {
          body.classList.remove('sidebar-open');
          overlay.style.display = 'none';
        }
      }
      $('#mainContentOverlay').on('click', toggleSidebar);

      function updateSidebarHeight() {
        const headerHeight = document.getElementById('header').getBoundingClientRect().bottom;
        const sidebarHeight = `calc(100dvh - ${headerHeight}px)`;
        $('.sidebar').css('height', sidebarHeight);
      }
